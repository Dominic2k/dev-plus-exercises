<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Management Module</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h2>Danh sách Users</h2>
                <button id="openModalBtn">+ Thêm User mới</button>
            </div>

            <div id="loading">Đang tải dữ liệu...</div>

            <div class="table-responsive">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Website</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="userModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Thêm User Mới</h3>
                <form id="addUserForm">
                    <div class="form-group">
                        <label>Name (*)</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Nhập tên đầy đủ"
                        />
                        <span class="error-message" id="error-name"
                            >Tên không được để trống</span
                        >
                    </div>
                    <div class="form-group">
                        <label>Username (*)</label>
                        <input
                            type="text"
                            id="username"
                            placeholder="Nhập tên đăng nhập"
                        />
                        <span class="error-message" id="error-username"
                            >Username không được để trống</span
                        >
                    </div>
                    <div class="form-group">
                        <label>Email (*)</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Nhập email"
                        />
                        <span class="error-message" id="error-email"
                            >Email không hợp lệ</span
                        >
                    </div>
                    <div class="form-group">
                        <label>Phone (*)</label>
                        <input
                            type="text"
                            id="phone"
                            placeholder="Nhập số điện thoại"
                        />
                        <span class="error-message" id="error-phone"
                            >Số điện thoại không hợp lệ</span
                        >
                    </div>
                    <div class="form-group">
                        <label>Website</label>
                        <input
                            type="text"
                            id="website"
                            placeholder="example.com"
                        />
                    </div>
                    <button type="submit" class="btn-submit">Thêm User</button>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
